name: Emulator smoke test

on:
  push:
    branches: [ "claude/**" ]
  workflow_dispatch:

permissions:
  contents: write # only to publish the demo recordings (API 35) as the "smoke-demo" pre-release

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 34, 35 ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/smoke.sh
      - name: Upload screenshots and logcat
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-api${{ matrix.api-level }}
          path: |
            smoke-*.png
            demo-*.mp4
            logcat.txt
          if-no-files-found: ignore
      - name: Publish demo recordings
        if: always() && matrix.api-level == 35 && hashFiles('demo-*.mp4') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete smoke-demo --yes --cleanup-tag || true
          gh release create smoke-demo demo-*.mp4 smoke-*.png \
            --target "$GITHUB_SHA" --prerelease \
            --title "Emulator demo recordings (${GITHUB_SHA::7})" \
            --notes "Screen recordings of the running debug app on an Android ${{ matrix.api-level }} emulator, made by scripts/smoke.sh. State reactions are shown with the debug visual preview (the same state the real assistant sets)."
