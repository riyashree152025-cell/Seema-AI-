name: Android CI

on:
  push:
    branches: [ "main", "ccr-*", "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # The sherpa-onnx AAR (50 MB, SHA-256 checked by Gradle) comes from a GitHub release, which
      # sometimes answers 504 for a while: keep it between runs so a build does not depend on that.
      - name: Cache sherpa-onnx AAR
        uses: actions/cache@v4
        with:
          path: app/libs/sherpa-onnx-*.aar
          key: sherpa-onnx-aar-1.13.8

      # Not cached yet: fetch it before Gradle, through the GitHub API with this run's token (the plain
      # release URL kept answering 504 to the runners), then the plain URL, a few times. Gradle still
      # checks its SHA-256.
      - name: Fetch sherpa-onnx AAR
        if: hashFiles('app/libs/sherpa-onnx-1.13.8.aar') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          for i in 1 2 3 4 5; do
            gh release download v1.13.8 -R k2-fsa/sherpa-onnx -p 'sherpa-onnx-1.13.8.aar' -D app/libs --clobber && break
            curl -fL --retry 3 --retry-delay 5 -o app/libs/sherpa-onnx-1.13.8.aar \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar && break
            rm -f app/libs/sherpa-onnx-1.13.8.aar
            sleep $((i * 15))
          done
          ls -la app/libs || true

      - name: No automatic release publishing in workflows
        # APK releases are made by hand by the owner. Fails if any workflow creates, edits, uploads to or
        # deletes a GitHub Release, or asks for write access to repository contents.
        run: python3 scripts/check_no_release_publishing.py

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Unit test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          total = failed = skipped = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', open(path).read())
              if m:
                  total += int(m[1]); skipped += int(m[2]); failed += int(m[3]) + int(m[4])
          print(f"UNIT TESTS: total={total} failed={failed} skipped={skipped}")
          PY

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build release APK (unsigned; checks R8/ProGuard rules)
        run: ./gradlew --no-daemon assembleRelease

      - name: No API keys inside the APKs
        run: |
          # Fails if anything that looks like a real Gemini/Groq/Cerebras/Tavily/OpenAI-style key is packaged.
          found=0
          for apk in app/build/outputs/apk/*/*.apk; do
            rm -rf /tmp/apkscan && mkdir /tmp/apkscan && unzip -q -o "$apk" -d /tmp/apkscan
            # Only a masked prefix and the file name are printed, never a whole match.
            hits=$(grep -raEo 'AIza[0-9A-Za-z_-]{35}|gsk_[0-9A-Za-z]{40,}|csk-[0-9a-z]{40,}|tvly-[0-9A-Za-z-]{20,}|sk-[0-9A-Za-z]{40,}' /tmp/apkscan | sed -E 's/^(.*:)?(.{6}).*/\1\2…(masked)/' | sort -u | head -5)
            if [ -n "$hits" ]; then
              echo "$hits"
              echo "::error::Key-like string found in $apk"; found=1
            else
              echo "OK: no key-like strings in $apk"
            fi
          done
          exit $found
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: raju-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
